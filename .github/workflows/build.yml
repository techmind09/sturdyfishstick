name: Build Sturdyfishstick Plugins

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Normalize Manifests & Prepare Environment
        run: |
          find . -name "AndroidManifest.xml" -exec sed -i 's/package="[^"]*"//g' {} +
          echo "Environment ready."

      - name: Build Plugins & Manifests
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x gradlew
            ./gradlew make --stacktrace || ./gradlew build --stacktrace
          else
            gradle make --stacktrace || gradle build --stacktrace
          fi

      - name: Force Generate plugins.json & Hashes
        run: |
          python3 -c "
          import json, glob, zipfile, os, hashlib

          print('Scanning for .cs3 files...')
          plugin_list = []
          
          for cs3_file in glob.glob('**/*.cs3', recursive=True):
              base = os.path.basename(cs3_file)
              manifest = {}
              try:
                  with zipfile.ZipFile(cs3_file, 'r') as zin:
                      if 'manifest.json' in zin.namelist():
                          manifest = json.loads(zin.read('manifest.json').decode('utf-8'))
              except Exception as e:
                  print(f'Error reading {base}: {e}')

              with open(cs3_file, 'rb') as f:
                  content = f.read()
              h = 'sha256-' + hashlib.sha256(content).hexdigest()
              sz = len(content)

              name = manifest.get('name', base.replace('.cs3', ''))
              internal_name = manifest.get('internalName', base.replace('.cs3', ''))
              version = manifest.get('version', 1)
              icon_url = manifest.get('iconUrl', '')

              plugin_entry = {
                  'name': name,
                  'internalName': internal_name,
                  'version': version,
                  'url': base,
                  'iconUrl': icon_url,
                  'fileHash': h,
                  'fileSize': sz
              }
              plugin_list.append(plugin_entry)

          # Write out plugins.json directly to root directory
          with open('plugins.json', 'w') as f:
              json.dump(plugin_list, f, indent=2)
          print(f'Successfully generated plugins.json with {len(plugin_list)} plugins.')
          "

      - name: Verify Output Artifacts
        run: |
          echo "=== Verifying Generated Files ==="
          mkdir -p $RUNNER_TEMP/build_artifacts
          find . -name "*.cs3" -exec cp {} $RUNNER_TEMP/build_artifacts/ \;
          find . -name "*.jar" ! -name "gradle-wrapper.jar" -exec cp {} $RUNNER_TEMP/build_artifacts/ \;
          if [ -f "plugins.json" ]; then
            cp plugins.json $RUNNER_TEMP/build_artifacts/
          fi
          if [ -f "repo.json" ]; then
            cp repo.json $RUNNER_TEMP/build_artifacts/
          fi
          ls -la $RUNNER_TEMP/build_artifacts/

      - name: Upload Build Artifacts (Zip)
        uses: actions/upload-artifact@v4
        with:
          name: allanime-plugins
          path: ${{ runner.temp }}/build_artifacts/*
          retention-days: 14

      - name: Deploy to Builds Branch
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git checkout -B builds
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          cp -r $RUNNER_TEMP/build_artifacts/* ./
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
          else
            git commit -m "Force generated plugins.json: ${{ github.sha }}"
            git push origin builds --force
          fi
